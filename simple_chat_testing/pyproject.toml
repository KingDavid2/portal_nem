[project]
name = "portal-nem-m0"
version = "0.0.1"
description = "M0 — provider-agnostic testing chat (OpenAI-compatible transport spike)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["m0chat"]
