[project]
name = "portal-nem-lesson-plans"
version = "0.0.1"
description = "M1 Phase A — AI lesson_plan generation baseline (ABPC proyecto, provider comparison)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "instructor>=1.5",
    "pydantic>=2",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lesson_plans"]
