          readOnly: true
        grade:
          type: integer
          readOnly: true
        school_name:
          type: string
          readOnly: true
        school_cct:
          type: string
          readOnly: true
        school_year_label:
          type: string
          readOnly: true
      required:
      - grade
      - id
      - label
      - school_cct
      - school_name
      - school_year_label
    CatalogMethodology:
      type: object
      description: The official Phase 6 planning methodology.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    CatalogPda:
      type: object
