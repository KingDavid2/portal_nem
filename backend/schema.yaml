components:
  schemas:
    CatalogContent:
      type: object
      description: An official content with its verified learning processes.
      properties:
        id:
          type: string
          readOnly: true
        text:
          type: string
          readOnly: true
        pdas:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPda'
          readOnly: true
      required:
      - id
      - pdas
      - text
    CatalogField:
      type: object
      description: A curriculum formative field (`campo formativo`).
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    CatalogGroup:
      type: object
      description: The automatic group context shown by the planning form.
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
        grade:
          type: integer
          readOnly: true
        school_name:
          type: string
          readOnly: true
        school_cct:
          type: string
          readOnly: true
        school_year_label:
          type: string
          readOnly: true
      required:
      - grade
      - id
      - label
      - school_cct
      - school_name
      - school_year_label
    CatalogMethodology:
      type: object
      description: The official Phase 6 planning methodology.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    CatalogPda:
      type: object
      description: A verified learning process (`PDA`) of an official content.
      properties:
        id:
          type: string
          readOnly: true
        text:
          type: string
          readOnly: true
      required:
      - id
      - text
    CatalogSubject:
      type: object
      description: A subject belonging to a formative field.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        field_id:
          type: string
          readOnly: true
      required:
      - field_id
      - id
      - name
    CatalogTeacher:
      type: object
      description: The requesting teacher's identity.
      properties:
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
    CatalogTheme:
      type: object
      description: A cross-cutting theme (`eje articulador`).
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    ContentSelection:
      type: object
      description: One official content plus the PDAs chosen under it.
      properties:
        content_id:
          type: string
        pda_ids:
          type: array
          items:
            type: string
      required:
      - content_id
      - pda_ids
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        school_year:
          type: integer
        grado:
          type: integer
          maximum: 3
          minimum: 1
        grupo:
          type: string
          maxLength: 1
        workspace:
          type: string
          format: uuid
          readOnly: true
      required:
      - grado
      - grupo
      - id
      - school_year
      - workspace
    LessonPlan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        workspace:
          type: string
          format: uuid
          readOnly: true
        group:
          type: integer
        campo:
          type: string
          maxLength: 200
        grade:
          type: string
          maxLength: 50
        theme:
          type: string
        field_id:
          type: string
          readOnly: true
        subject_id:
          type: string
          readOnly: true
        methodology_id:
          type: string
          readOnly: true
        duration_weeks:
          type: integer
          readOnly: true
          nullable: true
        start_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        scenario:
          allOf:
          - $ref: '#/components/schemas/ScenarioEnum'
          readOnly: true
        context_diagnosis:
          type: string
          readOnly: true
        cross_cutting_theme_ids:
          readOnly: true
        content_selections:
          readOnly: true
        title:
          type: string
          readOnly: true
        proyecto:
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
        model_name:
          type: string
          readOnly: true
        prompt_tokens:
          type: integer
          readOnly: true
          nullable: true
        completion_tokens:
          type: integer
          readOnly: true
          nullable: true
        invented_pdas:
          type: boolean
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - campo
      - completion_tokens
      - content_selections
      - context_diagnosis
      - created_at
      - cross_cutting_theme_ids
      - duration_weeks
      - end_date
      - failure_reason
      - field_id
      - generated_at
      - grade
      - group
      - id
      - invented_pdas
      - methodology_id
      - model_name
      - prompt_tokens
      - provider
      - proyecto
      - scenario
      - start_date
      - status
      - subject_id
      - theme
      - title
      - workspace
    LessonPlanCatalog:
      type: object
      description: Full payload of `GET /api/lesson-plans/catalog/`.
      properties:
        phase:
          type: integer
          readOnly: true
        grade:
          type: integer
          readOnly: true
        field:
          allOf:
          - $ref: '#/components/schemas/CatalogField'
          readOnly: true
        methodology:
          allOf:
          - $ref: '#/components/schemas/CatalogMethodology'
          readOnly: true
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/CatalogSubject'
          readOnly: true
        cross_cutting_themes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTheme'
          readOnly: true
        contents:
          type: array
          items:
            $ref: '#/components/schemas/CatalogContent'
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/CatalogGroup'
          readOnly: true
        teacher:
          allOf:
          - $ref: '#/components/schemas/CatalogTeacher'
          readOnly: true
      required:
      - contents
      - cross_cutting_themes
      - field
      - grade
      - group
      - methodology
      - phase
      - subjects
      - teacher
    LessonPlanCreate:
      type: object
      description: |-
        Write contract of `POST /api/lesson-plans/`.

        Every curriculum value arrives as an official catalog id — free text is
        only accepted for the teacher's own prose (`theme`, `context_diagnosis`).
        `campo` and `grade` are deliberately absent: the server derives them from
        the resolved field and the group, so a client that sends them is ignored.

        All catalog rules live in `validate()` rather than in per-field
        `validate_<name>` hooks because every one of them is answerable only once
        `field_id` is known, and DRF does not order field-level hooks.
      properties:
        group:
          type: integer
        field_id:
          type: string
        subject_id:
          type: string
          default: ''
        methodology_id:
          type: string
        theme:
          type: string
        context_diagnosis:
          type: string
        scenario:
          $ref: '#/components/schemas/ScenarioEnum'
        duration_weeks:
          type: integer
          maximum: 12
          minimum: 1
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        cross_cutting_theme_ids:
          type: array
          items:
            type: string
        content_selections:
          type: array
          items:
            $ref: '#/components/schemas/ContentSelection'
      required:
      - content_selections
      - context_diagnosis
      - cross_cutting_theme_ids
      - duration_weeks
      - end_date
      - field_id
      - group
      - methodology_id
      - scenario
      - start_date
      - theme
    LevelEnum:
      enum:
      - preescolar
      - primaria
      - secundaria
      type: string
      description: |-
        * `preescolar` - Preescolar
        * `primaria` - Primaria
        * `secundaria` - Secundaria
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    MembershipList:
