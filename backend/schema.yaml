      responses:
        '204':
          description: No response body
  /api/lesson-plans/{id}/export/:
    get:
      operationId: lesson_plans_export_retrieve
      description: |-
        GET /api/lesson-plans/<id>/export?format=docx|md (ai-planeaciones
        spec — "Ready LessonPlan Can Be Exported as Docx or Markdown").

        Only a `ready` plan may be exported; `pending`/`failed` are rejected
        (no partial/empty document is ever returned).
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - docx
          - md
        description: Export format; defaults to docx.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this lesson plan.
        required: true
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
          description: ''
  /api/lesson-plans/catalog/:
    get:
      operationId: lesson_plans_catalog_retrieve
      parameters:
      - in: query
        name: field
        schema:
          type: string
        description: Id of the formative field whose catalog is requested.
        required: true
      - in: query
        name: group
        schema:
          type: integer
        description: Id of the secondary-school group being planned for.
        required: true
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlanCatalog'
          description: ''
