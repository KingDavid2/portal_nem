        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolYear'
          description: ''
    patch:
      operationId: school_years_partial_update
      parameters:
      - in: path
