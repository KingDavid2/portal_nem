  /api/workspaces/:
    get:
      operationId: workspaces_list
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipList'
          description: ''
components:
  schemas:
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        school_year:
          type: integer
        grado:
          type: integer
          maximum: 3
          minimum: 1
        grupo:
          type: string
          maxLength: 1
        workspace:
          type: string
          format: uuid
          readOnly: true
      required:
      - grado
      - grupo
      - id
      - school_year
      - workspace
    LevelEnum:
      enum:
      - preescolar
      - primaria
      - secundaria
      type: string
      description: |-
        * `preescolar` - Preescolar
        * `primaria` - Primaria
        * `secundaria` - Secundaria
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    MembershipList:
      type: object
      description: |-
        One row per caller membership (workspaces spec — "Workspace-List
        Endpoint Returns Only the Caller's Memberships").
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - id
      - name
      - role
      - type
    PatchedGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        school_year:
          type: integer
        grado:
          type: integer
          maximum: 3
          minimum: 1
        grupo:
          type: string
          maxLength: 1
        workspace:
          type: string
          format: uuid
          readOnly: true
    PatchedSchool:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        cct:
          type: string
          maxLength: 10
        level:
          $ref: '#/components/schemas/LevelEnum'
        workspace:
          type: string
          format: uuid
          readOnly: true
    PatchedSchoolYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        school:
          type: integer
        label:
          type: string
          maxLength: 9
        workspace:
          type: string
          format: uuid
          readOnly: true
    PatchedStudent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group:
          type: integer
        first_name:
          type: string
          maxLength: 100
        last_name_paternal:
          type: string
          maxLength: 100
        last_name_maternal:
          type: string
          maxLength: 100
        curp:
          type: string
          maxLength: 18
        workspace:
          type: string
          format: uuid
          readOnly: true
    RoleEnum:
      enum:
      - owner
      - admin
      - member
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `member` - Member
    School:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        cct:
          type: string
          maxLength: 10
        level:
          $ref: '#/components/schemas/LevelEnum'
        workspace:
          type: string
          format: uuid
          readOnly: true
      required:
      - id
      - level
      - name
      - workspace
    SchoolYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        school:
          type: integer
        label:
          type: string
          maxLength: 9
        workspace:
          type: string
          format: uuid
          readOnly: true
      required:
      - id
      - label
      - school
      - workspace
    Student:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group:
          type: integer
        first_name:
          type: string
          maxLength: 100
        last_name_paternal:
          type: string
          maxLength: 100
        last_name_maternal:
          type: string
          maxLength: 100
        curp:
          type: string
          maxLength: 18
        workspace:
          type: string
          format: uuid
          readOnly: true
      required:
      - first_name
      - group
      - id
      - last_name_paternal
      - workspace
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
