    DemoSession:
      type: object
      description: |-
        The provisioning receipt as the polling client sees it.

        `workspace` and `email` are null until the session is `ready`;
        `error_message` is empty unless it `failed`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        persona:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status95aEnum'
          readOnly: true
        workspace:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        email:
          type: string
          nullable: true
          readOnly: true
        error_message:
          type: string
          readOnly: true
      required:
      - email
      - error_message
      - id
      - persona
      - status
      - workspace
    DemoSessionCreate:
      type: object
      description: |-
        Validates the requested persona against the registry.

        Rejecting an unknown key here (400) rather than in the task keeps a
        guaranteed-to-fail session from ever being written.
      properties:
        persona:
          $ref: '#/components/schemas/PersonaEnum'
      required:
      - persona
    GenerationQuota:
      type: object
      description: |-
        Full payload of `GET /api/lesson-plans/quota/` (the "Generaciones de
        este mes" card).

        `remaining` is served rather than left to the client: it is floored at
        zero, and a lowered `LESSON_PLAN_MONTHLY_GENERATION_LIMIT` can leave a
        workspace above its own allowance, where `limit - used` would render as
        a negative countdown.
      properties:
        period:
          type: string
          readOnly: true
        used:
          type: integer
          readOnly: true
        limit:
          type: integer
          readOnly: true
        remaining:
          type: integer
          readOnly: true
      required:
      - limit
      - period
      - remaining
      - used
