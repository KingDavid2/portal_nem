openapi: 3.0.3
info:
  title: portal_nem API
  version: 0.1.0
  description: Administrative school platform for Mexico (NEM).
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        Anonymous GET that sets the `csrftoken` cookie (design "dedicated
        GET /api/auth/csrf/"). Must stay reachable pre-login: `/me/` is
        IsAuthenticated and cannot bootstrap CSRF for the login call itself.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: CSRF cookie set
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Session login (identity-auth spec — "Session Login/Logout/Me
        Endpoints"). No JWT: this establishes the standard Django session
        cookie via `django.contrib.auth.login`.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Clears the current session server-side.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Session cleared
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns the current authenticated user's identity.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/groups/:
    get:
      operationId: groups_list
      tags:
      - groups
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
