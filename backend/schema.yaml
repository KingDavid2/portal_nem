          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSchoolYear'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolYear'
          description: ''
    delete:
      operationId: school_years_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this school year.
        required: true
      tags:
      - school-years
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
