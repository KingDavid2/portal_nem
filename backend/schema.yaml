            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlan'
          description: ''
    delete:
      operationId: lesson_plans_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this lesson plan.
        required: true
      tags:
      - lesson-plans
      security:
