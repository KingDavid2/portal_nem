openapi: 3.0.3
info:
  title: portal_nem API
  version: 0.1.0
  description: Administrative school platform for Mexico (NEM).
paths:
  /api/attendance/bulk/:
    put:
      operationId: attendance_bulk_update
      description: PUT /api/attendance/bulk/ — atomic upsert for one group+date.
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceBulkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceBulkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceBulkRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceBulkResponse'
          description: ''
  /api/attendance/roster/:
    get:
      operationId: attendance_roster_list
      description: GET /api/attendance/roster/ — full group roster merged with saved
        rows.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: group
        schema:
          type: integer
        required: true
      tags:
      - attendance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRosterEntry'
          description: ''
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        Anonymous GET that sets the `csrftoken` cookie (design "dedicated
        GET /api/auth/csrf/"). Must stay reachable pre-login: `/me/` is
        IsAuthenticated and cannot bootstrap CSRF for the login call itself.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: CSRF cookie set
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Session login (identity-auth spec — "Session Login/Logout/Me
        Endpoints"). No JWT: this establishes the standard Django session
        cookie via `django.contrib.auth.login`.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Clears the current session server-side.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Session cleared
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns the current authenticated user's identity.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/demo/personas/:
    get:
      operationId: demo_personas_list
      description: Lists the personas the picker offers.
      tags:
      - demo
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Persona'
          description: ''
  /api/demo/sessions/:
    post:
      operationId: demo_sessions_create
      description: Creates a `pending` receipt and hands provisioning to the worker.
      tags:
      - demo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DemoSessionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemoSessionCreate'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSession'
          description: ''
  /api/demo/sessions/{id}/:
    get:
      operationId: demo_sessions_retrieve
      description: |-
        Reports session status and, once ready, signs the guest in.

        Sign-in lives on the poll rather than on a separate endpoint so that
        re-opening a session URL later just re-signs into the same workspace —
        provisioning never runs twice (paysys `SessionsController#show`).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - demo
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSession'
          description: ''
  /api/groups/:
    get:
      operationId: groups_list
      tags:
      - groups
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
          description: ''
    post:
      operationId: groups_create
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Group'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
  /api/groups/{id}/:
    get:
      operationId: groups_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - groups
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    put:
      operationId: groups_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Group'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Group'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    patch:
      operationId: groups_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGroup'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    delete:
      operationId: groups_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - groups
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/lesson-plans/:
    get:
      operationId: lesson_plans_list
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonPlan'
          description: ''
    post:
      operationId: lesson_plans_create
      tags:
      - lesson-plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonPlanCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonPlanCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonPlanCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlan'
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/lesson-plans/{id}/:
    get:
      operationId: lesson_plans_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this lesson plan.
        required: true
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlan'
          description: ''
    delete:
      operationId: lesson_plans_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this lesson plan.
        required: true
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/lesson-plans/{id}/export/:
    get:
      operationId: lesson_plans_export_retrieve
      description: |-
        GET /api/lesson-plans/<id>/export?format=docx|md (ai-planeaciones
        spec — "Ready LessonPlan Can Be Exported as Docx or Markdown").

        Only a `ready` plan may be exported; `pending`/`failed` are rejected
        (no partial/empty document is ever returned).
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - docx
          - md
        description: Export format; defaults to docx.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this lesson plan.
        required: true
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
          description: ''
  /api/lesson-plans/catalog/:
    get:
      operationId: lesson_plans_catalog_retrieve
      parameters:
      - in: query
        name: field
        schema:
          type: string
        description: Id of the formative field whose catalog is requested.
        required: true
      - in: query
        name: group
        schema:
          type: integer
        description: Id of the secondary-school group being planned for.
        required: true
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlanCatalog'
          description: ''
  /api/lesson-plans/fields/:
    get:
      operationId: lesson_plans_fields_list
      description: |-
        GET /api/lesson-plans/fields/ — every formative field of the
        curriculum, in catalog order.

        Deliberately not folded into `catalog`: `catalog` needs a field id to
        answer, and the picker that supplies it has to be rendered first. Every
        field is listed, including the two with no verified content yet — the
        form keeps them selectable behind an empty state rather than pretending
        they do not exist.

        Named `formative_fields` with an explicit `url_path` so the method does
        not shadow anything named `fields` on the view.
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogField'
          description: ''
  /api/lesson-plans/quota/:
    get:
      operationId: lesson_plans_quota_retrieve
      description: |-
        GET /api/lesson-plans/quota/ — the monthly allowance of the active
        workspace ("Generaciones de este mes").

        Deliberately not folded into `catalog`: the card is rendered before
        the teacher has picked a group or a field, and `catalog` requires
        both. Reading is side-effect free — `current_usage` reports an absent
        ledger row as `0` instead of seeding one, so merely opening the form
        never writes.
      tags:
      - lesson-plans
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationQuota'
          description: ''
  /api/quizzy/chat/:
    post:
      operationId: quizzy_chat_create
      description: POST /api/quizzy/chat/ — Composer turn + persist conversation.
      tags:
      - quizzy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizzyChatRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuizzyChatRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuizzyChatRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizzyChatResponse'
          description: ''
  /api/quizzy/conversations/:
    get:
      operationId: quizzy_conversations_list
      description: GET /api/quizzy/conversations/ — owner's threads in active workspace.
      tags:
      - quizzy
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationList'
          description: ''
  /api/quizzy/conversations/{conversation_id}/:
    get:
      operationId: quizzy_conversations_retrieve
      description: GET/PATCH/DELETE /api/quizzy/conversations/<id>/.
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - quizzy
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: ''
    patch:
      operationId: quizzy_conversations_partial_update
      description: GET/PATCH/DELETE /api/quizzy/conversations/<id>/.
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - quizzy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConversationRename'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConversationRename'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConversationRename'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
          description: ''
    delete:
      operationId: quizzy_conversations_destroy
      description: GET/PATCH/DELETE /api/quizzy/conversations/<id>/.
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - quizzy
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
